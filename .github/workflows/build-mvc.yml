name: Build MVC

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: Src/TailwindMvc.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: Src/TailwindMvc.Web
        run: npm ci

      - name: Restore
        run: dotnet restore Src/TailwindMvc.Web/TailwindMvc.Web.csproj

      - name: Build
        run: >
          dotnet build
          Src/TailwindMvc.Web/TailwindMvc.Web.csproj
          --configuration Release
          --no-restore

      # - name: Copy artifacts
      #   run: |
      #     rm -rf .artifacts
      #     mkdir -p .artifacts

      #     cp -r Src/TailwindMvc.Web/bin .artifacts/
      #     cp -r Src/TailwindMvc.Web/obj .artifacts/

      - name: Publish
        run: >
          dotnet publish
          Src/TailwindMvc.Web/TailwindMvc.Web.csproj
          --configuration Release
          --framework net8.0
          --no-build
          --output ./publish/mvc

