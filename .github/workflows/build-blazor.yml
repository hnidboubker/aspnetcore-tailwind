name: Build Blazor

on:
  push:
    branches:
      - main
    paths:
      - 'src/TailwindBlazor.Web/**'
      - '.github/workflows/build-blazor.yml'

  pull_request:
    paths:
      - 'src/TailwindBlazor.Web/**'
      - '.github/workflows/build-blazor.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/TailwindBlazor.Web/TailwindBlazor.Web.csproj

      - name: Build
        run: dotnet build src/TailwindBlazor.Web/TailwindBlazor.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/TailwindBlazor.Web/TailwindBlazor.Web.csproj --configuration Release --no-build --output ./publish/blazor
