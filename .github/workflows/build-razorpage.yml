name: Build Razor Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/MyApp.RazorPage/**'
      - '.github/workflows/build-razorpage.yml'

  pull_request:
    paths:
      - 'src/MyApp.RazorPage/**'
      - '.github/workflows/build-razorpage.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj

      - name: Build
        run: dotnet build src/TailwindRazorPage.Webe/TailwindRazorPage.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/TailwidRazorPage.Web/TailwindrazorPage.Web.csproj --configuration Release --no-build --output ./publish/razorpage
