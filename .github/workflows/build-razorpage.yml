name: Build Razor Pages

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj

      - name: Build
        run: dotnet build Src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj --configuration Release --no-build --output ./publish/razorpage