name: Build Razor Pages

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: Src/TailwindRazorPage.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: Src/TailwindRazorPage.Web
        run: npm ci

      - name: Restore
        run: dotnet restore Src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj

      - name: Build
        run: dotnet build Src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj --configuration Release --no-restore

      - name: Copy artifacts
        run: |
          mkdir -p .artifacts
          cp -r Src/TailwindRazorPage.Web/bin .artifacts/
          cp -r Src/TailwindRazorPage.Web/obj .artifacts/

      - name: Publish
        run: dotnet publish Src/TailwindRazorPage.Web/TailwindRazorPage.Web.csproj --configuration Release --framework net8.0 --no-build --output ./publish/razorpage

      - name: Copy publish
        run: |
          mkdir -p .publish
          cp -r publish/. .publish/